name: Automated LIVE

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

concurrency:
  group: jtv-auto-update
  cancel-in-progress: false

jobs:
  update-file:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Configure Git User
        run: |
          git config user.name "sportlive18"
          git config user.email "271363488+sportlive18@users.noreply.github.com"

      - name: Download LiveEvent.m3u
        run: |
          export TZ="Asia/Kolkata"
          URL="https://sayan-jiotv.spal75084.workers.dev/LiveEvent.m3u"

          echo "📥 Downloading: $URL"
          HTTP_CODE=$(curl -sSL -w "%{http_code}" -o LiveEvent.m3u "$URL" || echo "000")
          echo "HTTP status: $HTTP_CODE"

          echo "📄 File size: $(wc -c < LiveEvent.m3u) bytes"
          echo "---- First 5 lines ----"
          head -n 5 LiveEvent.m3u || true
          echo "-----------------------"

          if [ "$HTTP_CODE" != "200" ]; then
            echo "❌ Download failed (HTTP $HTTP_CODE)"
            exit 1
          fi

          if [ ! -s LiveEvent.m3u ]; then
            echo "❌ Downloaded file is empty"
            exit 1
          fi

          if ! head -n 1 LiveEvent.m3u | grep -q "#EXTM3U"; then
            echo "⚠️ Warning: file does not start with #EXTM3U"
          fi

          echo "🚀 LiveEvent Synced | IST: $(date +'%Y-%m-%d %H:%M:%S')"

      - name: Commit Changes
        run: |
          export TZ="Asia/Kolkata"

          git add LiveEvent.m3u

          if git diff --cached --quiet; then
            echo "✅ No changes to commit"
            exit 0
          fi

          git commit -m "LiveEvent Updated ✅ [$(date +'%d-%m-%Y %H:%M')]"

      - name: Push Changes
        run: |
          set -e
          for i in 1 2 3; do
            echo "🚀 Push attempt $i..."
            git fetch origin main
            git rebase origin/main || { git rebase --abort; exit 1; }
            if git push origin HEAD:main; then
              echo "✅ Pushed to main"
              exit 0
            fi
            sleep 5
          done
          echo "❌ Failed to push after 3 attempts"
          exit 1
