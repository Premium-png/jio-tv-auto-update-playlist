name: Update JioTV Playlist

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'jtv.py'

concurrency:
  group: update-playlist
  cancel-in-progress: false

jobs:
  update-playlist:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pytz

      - name: Save old hashes
        id: before
        run: |
          for f in jtv.m3u jtv.json; do
            if [ -f "$f" ]; then
              echo "$f=$(sha256sum "$f" | awk '{print $1}')" >> "$GITHUB_OUTPUT"
            else
              echo "$f=missing" >> "$GITHUB_OUTPUT"
            fi
          done

      - name: Run jtv.py
        run: python jtv.py

      - name: Verify output files
        run: |
          echo "=== Directory listing ==="
          ls -la

          for FILE in jtv.m3u jtv.json; do
            if [ ! -f "$FILE" ]; then
              echo "ERROR: $FILE not found!"
              exit 1
            fi
            LINES=$(wc -l < "$FILE")
            echo "$FILE: $LINES lines"
            if [ "$LINES" -lt 10 ]; then
              echo "ERROR: $FILE is too small — likely empty or broken!"
              cat "$FILE"
              exit 1
            fi
          done
          echo "Verification passed."

      - name: Show changes
        run: |
          git status --porcelain
          git --no-pager diff --stat

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          git add -f jtv.m3u jtv.json

          if git diff --cached --quiet; then
            echo "No changes to commit — script produced identical output."
            exit 0
          fi

          git commit -m "Auto-update playlists: $(date -u) [skip ci]"

          # Sync with remote before pushing
          git fetch origin main
          git rebase origin/main || { git rebase --abort; git merge origin/main -m "merge"; }

          # Push the actual commit; HEAD:main works even if HEAD is detached
          for i in 1 2 3 4 5; do
            if git push origin HEAD:main; then
              echo "Push succeeded."
              exit 0
            fi
            echo "Push failed, retrying ($i)..."
            git fetch origin main
            git rebase origin/main || git rebase --abort
            sleep 5
          done

          echo "Push failed after retries."
          exit 1
