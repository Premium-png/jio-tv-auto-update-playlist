name: Sync Fork

on:
  schedule:
    - cron: '*/5 * * * *' # हर 5 मिनट में बैकग्राउंड में चेक करेगा
  workflow_dispatch: # मैनुअली तुरंत रन करने के लिए

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Open Source Fast-Forward Sync
        run: |
          curl -X POST \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            https://github.com \
            -d '{"branch":"main"}'
